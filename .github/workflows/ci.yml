name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nuxt UIのVite pluginはbuild時にComponent型宣言とtheme型を生成するため、型検査より先にbuildする。
      - name: Build
        run: npm run build

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test
